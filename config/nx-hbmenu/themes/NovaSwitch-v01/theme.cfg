meta {
    title = "NovaSwitch";
    creator = "sodasoba";
    revision = "0.1";
}

palette.light {
    text = (255, 255, 255, 255);
    wave.front = (0, 60, 80, 20);
    wave.mid = (0, 97, 194, 255);
    wave.back = (0, 204, 255, 200);
    bg = (0, 0, 0, 0);

    accent.main = (100, 220, 255, 255);
    accent.edge = (0, 204, 255, 255);

    border.main = (0, 60, 80, 100);
    border.text = (255, 255, 255, 255);
    divider = (151, 237, 247, 255);

    waves.blend = false;
}

palette.dark {
    text = (255, 255, 255, 255);
    wave.front = (0, 60, 80, 255);
    wave.mid = (0, 97, 194, 255);
    wave.back = (0, 204, 255, 255);
    bg = (0, 0, 0, 0);

    accent.main = (100, 220, 255, 255);
    accent.edge = (0, 204, 255, 255);

    border.main = (0, 60, 80, 100);
    border.text = (255, 255, 255, 255);
    divider = (151, 237, 247, 40);

    waves.blend = false;
}

ui.layout {
    background {
        enabled = true;
        origin = (0, 0);
    }

    system {
        hbmenu.visible = true;
        network.visible = true;
        loader.visible = true;
        logo.visible = true;
    }

    text.attention.origin = (-265, 140);

    active.entry {
        author.visible = true;
        author.origin = (117, 390);

        version.visible = true;
        version.origin = (490, 210);

        name.visible = true;
        icon.visible = true;
    }

    menu {
        path.visible = false;
        list.visible = false;
        tiles.visible = true;
        names.visible = true;
        icons.visible = true;
    }

    message.origin = (1205, 380);

    waves {
        back.visible = true;
        middle.visible = true;
        front.visible = true;
        front.size = (1280, 60);
    }

    icons.hidden = false;
}

resources {
    background {
        file = "assets/background.png";
        size = (1280, 672);
    }

    fallback.icon {
        file = "assets/invalid_icon.png";
        size = (256, 256);
    }

    folder.icon {
        file = "assets/folder_icon.png";
        size = (256, 256);
    }

    battery.icon {
        file = "assets/battery_icon.png";
        size = (24, 24);
    }

    wifi.none {
